root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./server/..."
  bin = "./tmp/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "web", "output", "backups", "pipeline"]
  watch_dir = "server"
  delay = 500

[log]
  time = false

[color]
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
