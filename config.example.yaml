pexels_api_key: ""
pixabay_api_key: ""
unsplash_access_key: ""
fal_api_key: ""
openai_api_key: ""
imagen_api_key: ""

voice:
  voice: "onyx"   # deep authoritative voice, best for documentary/history
  model: "tts-1"  # tts-1 (faster/cheaper) or tts-1-hd (higher quality)

channel:
  niche: "OriginVault - Untold origin stories of inventions and companies that shaped the world"
  video_length_min: 5
  video_length_max: 12

research:
  serper_api_key: ""   # optional — serper.dev (2,500 credits free, used for Google web/image search)
  news_api_key: ""     # newsapi.org

search:
  flickr_api_key: ""   # free — flickr.com/services/apps/create (best for historical/archival photos)
  google_api_key: ""   # free 100/day — console.cloud.google.com → Custom Search API → Credentials
  google_cse_id: ""    # free — cse.google.com → New search engine → enable Images → copy Search Engine ID
  bing_api_key: ""     # free 1000/month — portal.azure.com → Bing Search v7 → F1 tier → Keys and Endpoint

output_dir: "output"
